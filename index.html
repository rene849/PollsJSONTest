<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poll</title>

<style>
  /* ── Accessible Design Tokens ───────────────────────────────── */
  :root {
    --brand:        #2E45B8;   /* Economist Chicago 45 */
    --bar-bg:       #ebedfa;   /* Economist Chicago 95 */
    --text:         #0d0d0d;
    --text-muted:   #0d0d0d;   /* AAA Compliance */
    --bg:           #ffffff;
    --radius:       4px;
    --font:         system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --focus:        #E3120B;   /* Matches Moodle focus ring */
    --error-bg:     #ffffff;   
    --error-text:   #E3120B;   
    --error-border: #E3120B; 
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* Prevent scrollbars inside the iframe document */
  html, body { 
    font-family: var(--font); 
    background: transparent; 
    color: var(--text); 
    overflow: hidden; 
    margin: 0;
    padding: 16px; 
  }

  /* ── Poll Outer Card ─────────────────────────────────────────── */
  .poll {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: var(--bg);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px;
    display: flex;
    flex-direction: column;
  }

  /* ── Question Header ─────────────────────────────────────────── */
  .poll-question {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 20px;
  }

  /* ── View Switching Logic ────────────────────────────────────── */
  #loading-view, #vote-view, #results-view {
    display: none;
    flex-direction: column;
    flex-grow: 1;
  }

  .options, .results {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── Accessible Interactive Buttons ───────────────────────────── */
  .option-btn {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: var(--radius);
    background: var(--bg);
    cursor: pointer;
    font-size: 15px;
    color: var(--text);
    width: 100%;
    transition: background 0.15s, border-color 0.15s;
    font-family: var(--font);
    min-height: 64px;
    text-align: left;
    line-height: 1.35;
  }

  .option-btn:hover { background: #f9f9f9; border-color: var(--brand); }
  .option-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  /* Focus Indicator for Keyboard Navigation */
  .option-btn:focus-visible {
    outline: 5px solid var(--focus);
    outline-offset: 1px;
  }

  /* ── Submit Button ───────────────────────────────────────────── */
  .submit-btn {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    font-size: 15px;
    transition: opacity 0.2s, background 0.15s;
    height: 44px;
  }

  .submit-btn:hover    { background: #1a2a6e; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .submit-btn:focus-visible {
    outline: 5px solid var(--focus);
    outline-offset: 1px;
  }

  /* ── Results Rows ────────────────────────────────────────────── */
  .result-row {
    border: 1px solid #e0e0e0;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-radius: var(--radius);
    min-height: 64px;
  }

  .result-label {
    font-size: 14px;
    font-weight: 500;
    padding-bottom: 6px;
    color: var(--text);
    line-height: 1.3;
  }

  .result-label.mine { color: var(--brand); font-weight: 700; }

  .bar-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 20px;
  }

  .bar-track {
    flex-grow: 1;
    height: 20px;
    background: var(--bar-bg);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--brand);
    width: 0%;
    transition: width 0.5s cubic-bezier(0.1, 0.5, 0.5, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    padding: 0;
  }

  .inner-number {
    color: white;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    text-align: center;
    display: block;
    margin: 0 auto;
  }

  .result-pct {
    font-size: 14px;
    min-width: 38px;
    text-align: right;
    font-weight: 500;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    height: 20px;
    line-height: 1;
  }

  /* ── Footer Info Line ────────────────────────────────────────── */
  .footer-text-line {
    margin-top: 16px;
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: var(--bar-bg);
    border-radius: var(--radius);
    font-weight: 500;
  }

  /* ── Skeleton Loading State ───────────────────────────────────── */
  .skel {
    border-radius: var(--radius);
    background: linear-gradient(90deg, #f0f0f0 25%, #e4e4e4 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
  }

  .skel-option { height: 64px; margin-bottom: 12px; }
  .skel-option:last-child { margin-bottom: 0; }
  .skel-submit { height: 44px; margin-top: 16px; }

  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ── Accessible Error Banner ─────────────────────────────────── */
  .error-banner {
    padding: 16px;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    color: var(--error-text);
    line-height: 1.5;
    text-align: center;
  }

  #error-view { display: none; flex-grow: 1; }

  @media (max-width: 480px) {
    .poll { padding: 16px; }
    .poll-question { font-size: 16px; }
    .option-btn { font-size: 14px; }
  }
</style>
</head>
<body>

<script>
var SCRIPT_URL = null;
var POLL       = null;
</script>

<main class="poll" role="region" aria-labelledby="poll-question">
  <h2 class="poll-question" id="poll-question"></h2>

  <div id="loading-view" aria-hidden="true">
    <div id="skel-options"></div>
    <div class="skel skel-submit"></div>
  </div>

  <div id="vote-view">
    <div class="options" id="options-list" role="single-select"></div>
    <button class="submit-btn" id="submit-btn" disabled onclick="submitVote()">Submit</button>
    <div id="vote-error-inline" class="error-banner" style="display:none" role="alert"></div>
  </div>

  <div id="results-view" aria-live="polite">
    <div class="results" id="results-list"></div>
    <div class="footer-text-line">
      <span id="footer-text">You've already voted.</span>
      <span id="total-note"></span>
    </div>
  </div>

  <div id="error-view" role="alert">
    <div class="error-banner" id="error-msg"></div>
  </div>
</main>

<script>
(function () {
  var params   = new URLSearchParams(window.location.search);
  var intakeId = params.get("intake")   || null;
  var courseId = params.get("courseID") || null;
  var pollId   = params.get("pollID")   || null;
  var uid      = null;
  var uidReady = false;
  var hasVoted = false;
  var selected = null;

  var CACHE_KEY = (courseId && pollId && intakeId)
    ? "ee-poll-voted-" + courseId + "-" + pollId + "-" + intakeId
    : null;

  if (!intakeId || !courseId || !pollId) {
    showError("Sorry, this poll is not working right now. Please use the chat icon to contact the student success team.");
    return;
  }

  fetch("polls.json?v=1.0")
    .then(function(r) {
      if (!r.ok) throw new Error("Could not load polls.json");
      return r.json();
    })
    .then(function(data) {
      var course = (data.courses || []).find(function(c) { return c.courseID === courseId; });
      if (!course) throw new Error("Course not found: " + courseId);
      var poll = (course.polls || []).find(function(p) { return p.pollID === pollId; });
      if (!poll) throw new Error("Poll not found: " + pollId);
      
      POLL = { question: poll.question, options: poll.options };
      window.__pollOptionCount = poll.options.length;
      
      if (!course.scriptUrl) throw new Error("No scriptUrl for course: " + courseId);
      SCRIPT_URL = course.scriptUrl + "?sheetId=" + encodeURIComponent(course.sheetID);
      initialisePoll();
    })
    .catch(function(err) {
      showError("Sorry, this poll is not working right now. Please use the chat icon to contact the student success team.");
      console.error("Poll load error:", err);
    });

  function initialisePoll() {
    document.getElementById("poll-question").textContent = POLL.question;
    buildSkeleton();
    buildOptions();

    var cachedAnswer = CACHE_KEY ? localStorage.getItem(CACHE_KEY) : null;
    if (cachedAnswer) {
      hasVoted = true;
      var initialCounts = {};
      POLL.options.forEach(function(opt) {
        initialCounts[opt] = (opt === cachedAnswer) ? 1 : 0;
      });
      renderResults(initialCounts, 1, false, cachedAnswer);
    } else {
      show("vote-view");
    }

    var urlUid = params.get("uid");
    if (urlUid) {
      uid = urlUid;
      uidReady = true;
      checkVoteStatus();
    } else {
      window.addEventListener("message", function(event) {
        if (!event.data || event.data.type !== "moodleUserId") return;
        if (uidReady) return; 
        uid = String(event.data.userId);
        uidReady = true;
        checkVoteStatus();
      });

      setTimeout(function() {
        if (uidReady) return;
        uid = "anonymous";
        uidReady = true;
        checkVoteStatus();
      }, 3000);              
    }

    function checkVoteStatus() {
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "load", intakeId: intakeId, pollId: pollId, uid: uid })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.ok) return; 
        if (data.voted && CACHE_KEY) {
          localStorage.setItem(CACHE_KEY, data.answer);
        }
        if (data.voted) {
          renderResults(data.counts, data.total, false, data.answer);
        } else if (hasVoted && !data.voted) {
          if (CACHE_KEY) localStorage.removeItem(CACHE_KEY);
          hasVoted = false;
          hide("results-view");
          show("vote-view");
        }
      })
      .catch(function() {});
    }

    function buildSkeleton() {
      var skelList = document.getElementById("skel-options");
      skelList.innerHTML = "";
      POLL.options.forEach(function() {
        var s = document.createElement("div");
        s.className = "skel skel-option";
        skelList.appendChild(s);
      });
    }

    function buildOptions() {
      var list = document.getElementById("options-list");
      list.innerHTML = "";
      POLL.options.forEach(function(opt, i) {
        var btn = document.createElement("button");
        btn.className   = "option-btn";
        btn.textContent = opt;
        btn.setAttribute("aria-pressed", "false");
        btn.addEventListener("click", function() {
          selected = i;
          document.querySelectorAll(".option-btn").forEach(function(b, idx) {
            b.style.borderColor = (idx === i) ? "var(--brand)" : "#ddd";
            b.style.background  = (idx === i) ? "#f4f6ff"      : "#fff";
            b.setAttribute("aria-pressed", idx === i ? "true" : "false");
          });
          document.getElementById("submit-btn").disabled = false;
        });
        list.appendChild(btn);
      });
    }

    window.submitVote = function() {
      if (selected === null || !uidReady) return;

      var chosenOption = POLL.options[selected];
      hasVoted = true;

      if (CACHE_KEY) localStorage.setItem(CACHE_KEY, chosenOption);

      document.getElementById("submit-btn").disabled = true;
      document.querySelectorAll(".option-btn").forEach(function(b) { b.disabled = true; });

      var optimisticCounts = {};
      POLL.options.forEach(function(opt) {
        optimisticCounts[opt] = (opt === chosenOption) ? 1 : 0;
      });

      renderResults(optimisticCounts, 1, true, chosenOption);

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action:   "vote",
          intakeId: intakeId,
          pollId:   pollId,
          option:   chosenOption,
          uid:      uid
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok && data.counts) {
          updateBars(data.counts, data.total);
          setFooter(data.total);
        }
      })
      .catch(function() {});
    };

    function renderResults(counts, total, justVoted, myAnswer) {
      var box       = document.getElementById("results-list");
      var safeTotal = total || 0;
      box.innerHTML = "";

      POLL.options.forEach(function(opt) {
        var votes = (counts && counts[opt]) ? counts[opt] : 0;
        var pct   = safeTotal > 0 ? Math.round((votes / safeTotal) * 100) : 0;
        var mine  = opt === myAnswer;

        var row = document.createElement("div");
        row.className = "result-row";
        row.innerHTML =
          '<div class="result-label' + (mine ? " mine" : "") + '">' +
            (mine ? "✓ " : "") + opt +
          '</div>' +
          '<div class="bar-container">' +
            '<div class="bar-track" aria-label="' + pct + '% of votes">' +
              '<div class="bar-fill" style="width:0%">' +
                '<span class="inner-number">' + votes + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="result-pct">' + pct + '%</div>' +
          '</div>';
        box.appendChild(row);
      });

      setFooter(safeTotal);
      hide("loading-view");
      hide("vote-view");
      show("results-view");

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          box.querySelectorAll(".result-row").forEach(function(row, idx) {
            var opt   = POLL.options[idx];
            var votes = (counts && counts[opt]) ? counts[opt] : 0;
            var pct   = safeTotal > 0 ? Math.round((votes / safeTotal) * 100) : 0;
            var bar   = row.querySelector(".bar-fill");
            if (bar) bar.style.width = pct + "%";
          });
        });
      });
    }

    function updateBars(counts, total) {
      var safeTotal = total || 0;
      document.querySelectorAll(".result-row").forEach(function(row, idx) {
        var opt   = POLL.options[idx];
        var votes = (counts && counts[opt]) ? counts[opt] : 0;
        var pct   = safeTotal > 0 ? Math.round((votes / safeTotal) * 100) : 0;
        var bar   = row.querySelector(".bar-fill");
        var num   = row.querySelector(".inner-number");
        var pctEl = row.querySelector(".result-pct");
        if (bar)   bar.style.width   = pct + "%";
        if (num)   num.textContent   = votes;
        if (pctEl) pctEl.textContent = pct + "%";
      });
    }

    function setFooter(total) {
      var safeTotal = total || 0;
      var count = safeTotal + " response" + (safeTotal !== 1 ? "s" : "") + " so far.";
      document.getElementById("footer-text").textContent = "You've already voted.";
      document.getElementById("total-note").textContent  = " There are " + count;
    }

    function show(id) { document.getElementById(id).style.display = "flex"; }
    function hide(id) { document.getElementById(id).style.display = "none"; }

    function showError(msg) {
      hide("loading-view");
      hide("vote-view");
      document.getElementById("error-msg").textContent = msg;
      show("error-view");
    }
  }
})();
</script>

<script>
// Frame messaging height script (Eliminates scrollbars completely)
(function() {
  var lastHeight  = 0;
  var stableCount = 0;
  var roTimer     = null;

  var params   = new URLSearchParams(window.location.search);
  var intakeId = params.get('intake')   || null;
  var courseId = params.get('courseID') || null;
  var pollId   = params.get('pollID')   || null;

  function predictHeight(n) {
    // Exact element calculation + 16px extra breathing space for high DPI scaling
    return 32 + 48 + 55 + (n * 64) + ((n - 1) * 12) + 44 + 16 + 16;
  }

  function postHeight(h) {
    window.parent.postMessage({
      type:     'iframe-height',
      courseId: courseId,
      pollId:   pollId,
      intakeId: intakeId,
      height:   h
    }, '*');
  }

  function sendHeight() {
    // Ceil rounding eliminates fractional pixel triggers
    var currentHeight = Math.ceil(document.body.offsetHeight) + 16;
    if (currentHeight === lastHeight) {
      stableCount++;
      if (stableCount >= 3) return;
    } else {
      stableCount = 0;
      lastHeight  = currentHeight;
    }
    postHeight(currentHeight);
  }

  postHeight(predictHeight(3));

  var countPoller = setInterval(function() {
    if (window.__pollOptionCount) {
      clearInterval(countPoller);
      postHeight(predictHeight(window.__pollOptionCount));
    }
  }, 50);
  setTimeout(function() { clearInterval(countPoller); }, 4000);

  if (window.ResizeObserver) {
    var observer = new ResizeObserver(function() {
      clearTimeout(roTimer);
      roTimer = setTimeout(function() {
        stableCount = 0;
        sendHeight();
      }, 100);
    });
    observer.observe(document.body);
  }

  window.addEventListener('load', function() {
    setTimeout(sendHeight, 300);
  });
})();
</script>
</body>
</html>
