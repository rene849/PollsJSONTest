<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poll</title>

<style>
  :root {
    --brand:        #2E45B8;
    --bar-bg:       #ebedfa;
    --text:         #0d0d0d;
    --text-muted:   #0d0d0d;
    --bg:           #ffffff;
    --radius:       4px;
    --font:         -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    --focus:        #E3120B;
    --error-bg:     #ffffff;
    --error-text:   #E3120B;
    --error-border: #E3120B;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body { 
    font-family: var(--font); 
    background: transparent; 
    color: var(--text); 
    overflow: hidden; 
    margin: 0;
    padding: 12px; 
  }

  /* Keep entire card invisible until content is 100% built */
  .poll {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: var(--bg);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease-in;
  }

  .poll.is-ready {
    opacity: 1;
    visibility: visible;
  }

  .poll-question {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 20px;
  }

  #loading-view, #vote-view, #results-view {
    display: none;
    flex-direction: column;
  }

  .options, .results {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: var(--radius);
    background: var(--bg);
    cursor: pointer;
    font-size: 15px;
    color: var(--text);
    width: 100%;
    transition: background 0.15s, border-color 0.15s;
    font-family: var(--font);
    height: 60px;
    text-align: left;
    line-height: 1.35;
  }

  .option-btn:hover { background: #f9f9f9; border-color: var(--brand); }
  .option-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .option-btn:focus-visible {
    outline: 5px solid var(--focus);
    outline-offset: 1px;
  }

  .submit-btn {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    font-size: 15px;
    transition: opacity 0.2s, background 0.15s;
    height: 44px;
  }

  .submit-btn:hover    { background: #1a2a6e; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .submit-btn:focus-visible {
    outline: 5px solid var(--focus);
    outline-offset: 1px;
  }

  .result-row {
    border: 1px solid #e0e0e0;
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-radius: var(--radius);
    min-height: 60px;
    height: auto;
  }

  .result-label {
    font-size: 14px;
    font-weight: 500;
    padding-bottom: 4px;
    color: var(--text);
    line-height: 1.2;
    white-space: normal;
    overflow: visible;
    word-break: break-word;
  }

  .result-label.mine { color: var(--brand); font-weight: 700; }

  .bar-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 18px;
  }

  .bar-track {
    flex-grow: 1;
    height: 18px;
    background: var(--bar-bg);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--brand);
    width: 0%;
    transition: width 0.4s ease-out;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    padding: 0;
  }

  .inner-number {
    color: white;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    text-align: center;
    display: block;
    margin: 0 auto;
  }

  .result-pct {
    font-size: 13px;
    min-width: 38px;
    text-align: right;
    font-weight: 500;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    height: 18px;
    line-height: 1;
  }

  .footer-text-line {
    margin-top: 16px;
    font-size: 15px;
    color: var(--text-muted);
    text-align: center;
    min-height: 44px;
    height: auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 10px 12px;
    background: var(--bar-bg);
    border-radius: var(--radius);
    font-weight: 500;
    line-height: 1.4;
  }

  .error-banner {
    padding: 16px 24px;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    color: var(--error-text);
    line-height: 1.5;
    text-align: center;
    width: 100%;
    box-sizing: border-box;
  }

  #error-view { display: none; }

  @media (max-width: 480px) {
    .poll { padding: 16px; }
    .poll-question { font-size: 16px; }
    .option-btn { font-size: 14px; }
  }
</style>
</head>
<body>

<script>
var SCRIPT_URL = null;
var POLL       = null;
</script>

<main class="poll" role="region" aria-labelledby="poll-question">
  <h2 class="poll-question" id="poll-question"></h2>

  <div id="vote-view">
    <div class="options" id="options-list" role="group" aria-labelledby="poll-question"></div>
    <button class="submit-btn" id="submit-btn" onclick="submitVote()">Submit</button>
    <div id="vote-error-inline" class="error-banner" style="display:none" role="alert"></div>
  </div>

  <div id="results-view" aria-live="polite">
    <div class="results" id="results-list"></div>
    <div class="footer-text-line">
      <span id="footer-text">You’ve already voted.</span>
      <span id="total-note"></span>
    </div>
  </div>

  <div id="error-view" role="alert">
    <div class="error-banner" id="error-msg"></div>
  </div>
</main>

<script>
(function () {
  var urlParams = new URLSearchParams(window.location.search);
  var intakeId  = urlParams.get("intake")   || null;
  var courseId  = urlParams.get("courseID") || null;
  var pollId    = urlParams.get("pollID")   || null;
  var uid       = null;
  var uidReady  = false;
  var hasVoted  = false;
  var selected  = null;

  var CACHE_KEY = (courseId && pollId && intakeId)
    ? "ee-poll-voted-" + courseId + "-" + pollId + "-" + intakeId
    : null;

  if (!intakeId || !courseId || !pollId) {
    showError("Sorry, this poll is not working right now. Please use the chat icon to contact the student success team.");
    return;
  }

  var uidPromise = new Promise(function(resolve) {
    window.addEventListener("message", function(event) {
      if (!event.data || event.data.type !== "moodleUserId") return;
      var userId = (event.data.userId && event.data.userId !== "0")
        ? String(event.data.userId)
        : "anonymous";
      resolve(userId);
    });
    setTimeout(function() { resolve("anonymous"); }, 1500);
  });

  var jsonPromise = fetch("polls.json")
    .then(function(r) {
      if (!r.ok) throw new Error("Could not load polls.json");
      return r.json();
    });

  Promise.all([jsonPromise, uidPromise])
    .then(function(resolved) {
      var data = resolved[0];
      uid      = resolved[1];
      uidReady = true;

      var scriptUrl = data.scriptUrl || null;
      if (!scriptUrl) throw new Error("No scriptUrl in polls.json");

      var course = (data.courses || []).find(function(c) { return c.courseID === courseId; });
      if (!course) throw new Error("Course not found: " + courseId);
      var poll = (course.polls || []).find(function(p) { return p.pollID === pollId; });
      if (!poll) throw new Error("Poll not found: " + pollId);

      POLL = { question: poll.question, options: poll.options };
      window.__pollOptionCount = poll.options.length;

      var sheetId = poll.sheetID || course.sheetID || null;
      if (!sheetId) throw new Error("No sheetID found for poll: " + pollId);
      SCRIPT_URL = scriptUrl + "?sheetId=" + encodeURIComponent(sheetId);
      initialisePoll();
    })
    .catch(function(err) {
      showError("Sorry, this poll is not working right now. Please use the chat icon to contact the student success team.");
      console.error("Poll load error:", err);
    });

  function initialisePoll() {
    document.getElementById("poll-question").textContent = POLL.question;
    
    // Build options DOM nodes first
    buildOptions();

    var cachedAnswer = CACHE_KEY ? localStorage.getItem(CACHE_KEY) : null;
    if (cachedAnswer) {
      hasVoted = true;
      var initialCounts = {};
      POLL.options.forEach(function(opt) {
        initialCounts[opt] = (opt === cachedAnswer) ? 1 : 0;
      });
      renderResults(initialCounts, 1, false, cachedAnswer);
    } else {
      show("vote-view");
      revealPoll();
    }

    checkVoteStatus();

    function checkVoteStatus() {
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "load", intakeId: intakeId, pollId: pollId, uid: uid })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.ok) return;
        if (data.voted && CACHE_KEY) {
          localStorage.setItem(CACHE_KEY, data.answer);
        }
        if (data.voted) {
          renderResults(data.counts, data.total, false, data.answer);
        } else if (hasVoted && !data.voted) {
          if (CACHE_KEY) localStorage.removeItem(CACHE_KEY);
          hasVoted = false;
          hide("results-view");
          show("vote-view");
        }
        revealPoll();
      })
      .catch(function() {
        revealPoll();
      });
    }

    function buildOptions() {
      var list = document.getElementById("options-list");
      list.innerHTML = "";
      POLL.options.forEach(function(opt, i) {
        var btn = document.createElement("button");
        btn.className   = "option-btn";
        btn.textContent = opt;
        btn.setAttribute("aria-pressed", "false");
        btn.addEventListener("click", function() {
          selected = i;
          document.querySelectorAll(".option-btn").forEach(function(b, idx) {
            b.style.borderColor = (idx === i) ? "var(--brand)" : "#ddd";
            b.style.background  = (idx === i) ? "#f4f6ff"      : "#fff";
            b.setAttribute("aria-pressed", idx === i ? "true" : "false");
          });
          document.getElementById("submit-btn").disabled = false;
        });
        list.appendChild(btn);
      });
    }

    window.submitVote = function() {
      if (selected === null) {
        var firstBtn = document.querySelector(".option-btn");
        if (firstBtn) firstBtn.focus();
        return;
      }
      if (!uidReady) return;

      var chosenOption = POLL.options[selected];
      hasVoted = true;

      if (CACHE_KEY) localStorage.setItem(CACHE_KEY, chosenOption);

      document.getElementById("submit-btn").disabled = true;
      document.querySelectorAll(".option-btn").forEach(function(b) { b.disabled = true; });

      var optimisticCounts = {};
      POLL.options.forEach(function(opt) {
        optimisticCounts[opt] = (opt === chosenOption) ? 1 : 0;
      });

      renderResults(optimisticCounts, 1, true, chosenOption);

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action:   "vote",
          intakeId: intakeId,
          pollId:   pollId,
          option:   chosenOption,
          uid:      uid
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.ok && data.counts) {
          updateBars(data.counts, data.total);
          setFooter(data.total);
        }
      })
      .catch(function() {});
    };

    function renderResults(counts, total, justVoted, myAnswer) {
      var box       = document.getElementById("results-list");
      var safeTotal = total || 0;
      box.innerHTML = "";

      POLL.options.forEach(function(opt) {
        var votes = (counts && counts[opt]) ? counts[opt] : 0;
        var pct   = safeTotal > 0 ? Math.round((votes / safeTotal) * 100) : 0;
        var mine  = opt === myAnswer;

        var row = document.createElement("div");
        row.className = "result-row";
        row.innerHTML =
          '<div class="result-label' + (mine ? " mine" : "") + '">' +
            (mine ? "\u2713 " : "") + opt +
          '</div>' +
          '<div class="bar-container">' +
            '<div class="bar-track" role="img" aria-label="' + opt + ': ' + pct + '% of votes">' +
              '<div class="bar-fill" style="width:0%">' +
                '<span class="inner-number">' + votes + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="result-pct">' + pct + '%</div>' +
          '</div>';
        box.appendChild(row);
      });

      setFooter(safeTotal);
      hide("vote-view");
      show("results-view");
      revealPoll();

      if (window.__triggerFrameHeight) window.__triggerFrameHeight();

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          box.querySelectorAll(".result-row").forEach(function(row, idx) {
            var opt   = POLL.options[idx];
            var votes = (counts && counts[opt]) ? counts[opt] : 0;
            var pct   = safeTotal > 0 ? Math.round((votes / safeTotal) * 100) : 0;
            var bar   = row.querySelector(".bar-fill");
            if (bar) bar.style.width = pct + "%";
          });
        });
      });
    }

    function updateBars(counts, total) {
      var safeTotal = total || 0;
      document.querySelectorAll(".result-row").forEach(function(row, idx) {
        var opt   = POLL.options[idx];
        var votes = (counts && counts[opt]) ? counts[opt] : 0;
        var pct   = safeTotal > 0 ? Math.round((votes / safeTotal) * 100) : 0;
        var bar   = row.querySelector(".bar-fill");
        var num   = row.querySelector(".inner-number");
        var pctEl = row.querySelector(".result-pct");
        if (bar)   bar.style.width   = pct + "%";
        if (num)   num.textContent   = votes;
        if (pctEl) pctEl.textContent = pct + "%";
      });
    }

    function setFooter(total) {
      var safeTotal = total || 0;
      var verb = safeTotal === 1 ? "is" : "are";
      var count = safeTotal + " response" + (safeTotal !== 1 ? "s" : "") + " so far.";
      document.getElementById("footer-text").textContent = "You’ve already voted.";
      document.getElementById("total-note").textContent  = " There " + verb + " " + count;
    }

    function show(id) { document.getElementById(id).style.display = "flex"; }
    function hide(id) { document.getElementById(id).style.display = "none"; }

    function revealPoll() {
      requestAnimationFrame(function() {
        document.querySelector(".poll").classList.add("is-ready");
      });
    }

    function showError(msg) {
      hide("vote-view");
      document.getElementById("error-msg").textContent = msg;
      show("error-view");
      revealPoll();
      if (window.__triggerFrameHeight) window.__triggerFrameHeight();
    }
  }

  function showError(msg) {
    document.getElementById("vote-view").style.display  = "none";
    document.getElementById("error-msg").textContent  = msg;
    document.getElementById("error-view").style.display = "flex";
    document.querySelector(".poll").classList.add("is-ready");
  }

})();
</script>

<script>
// Frame messaging height script
(function() {
  var lastHeight  = 0;
  var stableCount = 0;
  var roTimer     = null;

  var searchParams = new URLSearchParams(window.location.search);
  var intakeId     = searchParams.get('intake')   || null;
  var courseId     = searchParams.get('courseID') || null;
  var pollId       = searchParams.get('pollID')   || null;

  function postHeight(h) {
    if (!h || h <= 0) return;
    window.parent.postMessage({
      type:     'iframe-height',
      courseId: courseId,
      pollId:   pollId,
      intakeId: intakeId,
      height:   h
    }, '*');
  }

  function sendHeight() {
    var pollCard = document.querySelector('.poll');
    if (!pollCard) return;
    var currentHeight = Math.ceil(pollCard.getBoundingClientRect().height) + 36;
    if (currentHeight === lastHeight) {
      stableCount++;
      if (stableCount >= 3) return;
    } else {
      stableCount = 0;
      lastHeight  = currentHeight;
    }
    postHeight(currentHeight);
  }

  window.__triggerFrameHeight = function() {
    stableCount = 0;
    sendHeight();
  };

  sendHeight();

  var countPoller = setInterval(function() {
    if (window.__pollOptionCount) {
      clearInterval(countPoller);
      sendHeight();
    }
  }, 20);
  setTimeout(function() { clearInterval(countPoller); }, 4000);

  if (window.ResizeObserver) {
    var observer = new ResizeObserver(function() {
      clearTimeout(roTimer);
      roTimer = setTimeout(function() {
        stableCount = 0;
        sendHeight();
      }, 30);
    });
    observer.observe(document.body);
  }

  window.addEventListener('load', function() {
    setTimeout(sendHeight, 100);
  });
})();
</script>
</body>
</html>
